<!doctype html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <title>Ⓜ️GROUPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'system-ui', 'sans-serif'],
            orbitron: ['Orbitron', 'monospace'],
          },
          colors: {
            brand: { 400: '#ff4d5a', 500: '#e50914', 600: '#cf0813', 700: '#b20710' },
            accent: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a' },
            neon: { blue: '#00d4ff', purple: '#a855f7', pink: '#ec4899', cyan: '#22d3ee' }
          },
          boxShadow: {
            soft: '0 22px 55px rgba(0,0,0,0.75)',
            glow: '0 0 40px rgba(0,212,255,0.15)',
          },
        }
      }
    }
  </script>

  <style>
    /* === THEME SYSTEM (4 THEMES) === */
    [data-theme="cosmic"] {
      --bg-primary: #050510;
      --orb1: rgba(229,9,20,0.4);
      --orb2: rgba(0,212,255,0.3);
      --orb3: rgba(168,85,247,0.3);
      --orb4: rgba(236,72,153,0.25);
      --orb5: rgba(34,211,238,0.2);
      --glass-bg: rgba(10,15,30,0.75);
      --glass-border: rgba(255,255,255,0.08);
      --header-bg: rgba(10,15,30,0.9);
      --input-bg: rgba(5,10,25,0.6);
      --table-bg: rgba(8,12,25,0.6);
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-line: #00d4ff;
    }
    [data-theme="forest"] {
      --bg-primary: #020d08;
      --orb1: rgba(34,197,94,0.35);
      --orb2: rgba(16,185,129,0.3);
      --orb3: rgba(52,211,153,0.25);
      --orb4: rgba(134,239,172,0.2);
      --orb5: rgba(6,78,59,0.4);
      --glass-bg: rgba(5,20,12,0.78);
      --glass-border: rgba(34,197,94,0.12);
      --header-bg: rgba(2,15,8,0.92);
      --input-bg: rgba(2,10,6,0.65);
      --table-bg: rgba(3,12,7,0.65);
      --text-primary: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent-line: #22c55e;
    }
    [data-theme="sunset"] {
      --bg-primary: #0d0500;
      --orb1: rgba(251,146,60,0.4);
      --orb2: rgba(245,158,11,0.35);
      --orb3: rgba(239,68,68,0.3);
      --orb4: rgba(253,224,71,0.2);
      --orb5: rgba(194,65,12,0.35);
      --glass-bg: rgba(20,10,3,0.78);
      --glass-border: rgba(251,146,60,0.12);
      --header-bg: rgba(15,7,0,0.92);
      --input-bg: rgba(12,5,0,0.65);
      --table-bg: rgba(10,5,0,0.65);
      --text-primary: #fff7ed;
      --text-muted: #fdba74;
      --accent-line: #f97316;
    }
    [data-theme="arctic"] {
      --bg-primary: #f8fafc;
      --orb1: rgba(56,189,248,0.25);
      --orb2: rgba(99,102,241,0.2);
      --orb3: rgba(168,85,247,0.15);
      --orb4: rgba(14,165,233,0.2);
      --orb5: rgba(167,243,208,0.3);
      --glass-bg: rgba(255,255,255,0.6);
      --glass-border: rgba(148,163,184,0.25);
      --header-bg: rgba(255,255,255,0.8);
      --input-bg: rgba(241,245,249,0.8);
      --table-bg: rgba(248,250,252,0.7);
      --text-primary: #0f172a;
      --text-muted: #475569;
      --accent-line: #0ea5e9;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
      transition: background 0.6s ease, color 0.6s ease;
    }

    .bg-cosmos {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-cosmos .orb {
      position: absolute; border-radius: 50%;
      filter: blur(100px); opacity: 0.4;
      animation: orbDrift 25s ease-in-out infinite;
      transition: background 0.8s ease;
    }
    .bg-cosmos .orb:nth-child(1) {
      width:700px;height:700px;
      background: radial-gradient(circle, var(--orb1), transparent 70%);
      top:-15%;left:-10%;animation-duration:30s;
    }
    .bg-cosmos .orb:nth-child(2) {
      width:600px;height:600px;
      background: radial-gradient(circle, var(--orb2), transparent 70%);
      top:40%;right:-15%;animation-delay:-8s;animation-duration:28s;
    }
    .bg-cosmos .orb:nth-child(3) {
      width:500px;height:500px;
      background: radial-gradient(circle, var(--orb3), transparent 70%);
      bottom:-10%;left:25%;animation-delay:-15s;animation-duration:32s;
    }
    .bg-cosmos .orb:nth-child(4) {
      width:400px;height:400px;
      background: radial-gradient(circle, var(--orb4), transparent 70%);
      top:20%;left:50%;animation-delay:-20s;animation-duration:35s;
    }
    .bg-cosmos .orb:nth-child(5) {
      width:350px;height:350px;
      background: radial-gradient(circle, var(--orb5), transparent 70%);
      bottom:30%;right:30%;animation-delay:-12s;animation-duration:26s;
    }
    @keyframes orbDrift {
      0%,100% { transform:translate(0,0) scale(1); }
      25% { transform:translate(80px,-60px) scale(1.1); }
      50% { transform:translate(-50px,80px) scale(0.9); }
      75% { transform:translate(60px,30px) scale(1.05); }
    }

    .bg-grid {
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background-size:80px 80px;
      background-image:
        linear-gradient(to right,rgba(255,255,255,0.015) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(255,255,255,0.015) 1px,transparent 1px);
      mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);
      -webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);
    }
    [data-theme="arctic"] .bg-grid {
      background-image:
        linear-gradient(to right,rgba(0,0,0,0.03) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(0,0,0,0.03) 1px,transparent 1px);
    }

    .bg-noise {
      position:fixed;inset:0;z-index:1;opacity:0.025;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat:repeat;background-size:256px 256px;
    }

    .particles { position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden; }
    .particle {
      position:absolute;border-radius:50%;
      background:rgba(255,255,255,0.25);
      animation:particleFloat linear infinite;
    }
    [data-theme="arctic"] .particle { background:rgba(14,165,233,0.3); }
    [data-theme="forest"] .particle { background:rgba(34,197,94,0.3); }
    [data-theme="sunset"] .particle { background:rgba(251,146,60,0.3); }
    .particle:nth-child(1){width:2px;height:2px;left:8%;animation-duration:14s;}
    .particle:nth-child(2){width:3px;height:3px;left:18%;animation-duration:18s;animation-delay:-3s;opacity:.4;}
    .particle:nth-child(3){width:2px;height:2px;left:32%;animation-duration:12s;animation-delay:-7s;}
    .particle:nth-child(4){width:4px;height:4px;left:45%;animation-duration:20s;animation-delay:-2s;opacity:.3;}
    .particle:nth-child(5){width:2px;height:2px;left:58%;animation-duration:15s;animation-delay:-9s;}
    .particle:nth-child(6){width:3px;height:3px;left:72%;animation-duration:16s;animation-delay:-5s;opacity:.5;}
    .particle:nth-child(7){width:2px;height:2px;left:85%;animation-duration:13s;animation-delay:-11s;}
    .particle:nth-child(8){width:3px;height:3px;left:92%;animation-duration:17s;animation-delay:-4s;opacity:.35;}
    .particle:nth-child(9){width:2px;height:2px;left:50%;animation-duration:19s;animation-delay:-13s;}
    .particle:nth-child(10){width:4px;height:4px;left:25%;animation-duration:22s;animation-delay:-6s;opacity:.2;}
    @keyframes particleFloat {
      0%{transform:translateY(105vh) scale(0);opacity:0;}
      8%{opacity:1;transform:translateY(92vh) scale(1);}
      92%{opacity:.4;}
      100%{transform:translateY(-5vh) translateX(30px) scale(.3);opacity:0;}
    }

    .glass-ultra {
      background:
        radial-gradient(ellipse at top left,rgba(255,255,255,0.08),transparent 50%),
        radial-gradient(ellipse at bottom right,rgba(0,212,255,0.05),transparent 50%);
      background-color: var(--glass-bg);
      backdrop-filter:blur(40px) saturate(180%);
      -webkit-backdrop-filter:blur(40px) saturate(180%);
      border:1px solid var(--glass-border);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.15);
      transition: background-color 0.6s ease, border-color 0.6s ease;
    }
    [data-theme="arctic"] .glass-ultra {
      box-shadow:0 10px 40px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .glass-header {
      background-color: var(--header-bg);
      backdrop-filter:blur(50px) saturate(200%);
      -webkit-backdrop-filter:blur(50px) saturate(200%);
      border-bottom:1px solid var(--glass-border);
      box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 -1px 0 rgba(255,255,255,0.05);
      transition: background-color 0.6s ease, border-color 0.6s ease;
    }

    .glass-card {
      background-color: var(--glass-bg);
      backdrop-filter:blur(30px) saturate(160%);
      -webkit-backdrop-filter:blur(30px) saturate(160%);
      border:1px solid var(--glass-border);
      box-shadow:0 20px 50px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06);
      transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .glass-card:hover {
      border-color:var(--accent-line);
      box-shadow:0 25px 60px rgba(0,0,0,0.4),0 0 30px rgba(0,212,255,0.08),inset 0 1px 0 rgba(255,255,255,0.1);
      transform:translateY(-2px);
    }

    .glass-chip {
      background-color: var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      box-shadow:0 4px 16px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .glass-input {
      background: var(--input-bg);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border:1px solid var(--glass-border);
      color: var(--text-primary);
      box-shadow:inset 0 2px 8px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.03);
      transition:all 0.3s ease;
    }
    .glass-input::placeholder { color: var(--text-muted); opacity: 0.6; }
    .glass-input:focus {
      outline:none;
      border-color:var(--accent-line);
      box-shadow:inset 0 2px 8px rgba(0,0,0,0.3),0 0 20px rgba(0,212,255,0.12),0 0 40px rgba(0,212,255,0.05);
    }

    .glass-table {
      background: var(--table-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      box-shadow:0 15px 40px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.04);
      transition: background 0.6s ease;
    }

    .theme-panel {
      position: fixed;
      right: -260px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
      display: flex;
      align-items: center;
    }
    .theme-panel.open { right: 0; }

    .theme-toggle-tab {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-right: none;
      border-radius: 12px 0 0 12px;
      padding: 12px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      writing-mode: vertical-rl;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      box-shadow: -4px 0 20px rgba(0,0,0,0.2);
      user-select: none;
    }

    .theme-panel-inner {
      width: 260px;
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-right: none;
      border-radius: 16px 0 0 16px;
      padding: 20px;
      box-shadow: -8px 0 40px rgba(0,0,0,0.3);
    }

    .theme-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      position: relative;
      overflow: hidden;
    }
    .theme-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
      transition: left 0.5s;
    }
    .theme-btn:hover::before { left: 100%; }
    .theme-btn:hover { transform: translateX(-4px); }
    .theme-btn.active { border-color: var(--accent-line); }

    .theme-btn-cosmic {
      background: linear-gradient(135deg,rgba(229,9,20,0.2),rgba(0,212,255,0.2));
      color: #e2e8f0;
    }
    .theme-btn-forest {
      background: linear-gradient(135deg,rgba(34,197,94,0.2),rgba(16,185,129,0.2));
      color: #d1fae5;
    }
    .theme-btn-sunset {
      background: linear-gradient(135deg,rgba(251,146,60,0.2),rgba(239,68,68,0.2));
      color: #fff7ed;
    }
    .theme-btn-arctic {
      background: linear-gradient(135deg,rgba(56,189,248,0.15),rgba(99,102,241,0.15));
      color: #0f172a;
    }

    .theme-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    [data-theme="forest"] .text-gradient { color: #22c55e !important; }
    [data-theme="sunset"] .text-gradient { color: #f97316 !important; }
    [data-theme="arctic"] .text-gradient { color: #0ea5e9 !important; }

    .btn-neon {
      position:relative;overflow:hidden;border-radius:9999px;
      font-weight:600;letter-spacing:0.02em;
      transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .btn-neon::before {
      content:'';position:absolute;top:0;left:-100%;
      width:100%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
      transition:left 0.5s ease;
    }
    .btn-neon:hover::before { left:100%; }
    .btn-neon::after {
      content:'';position:absolute;inset:-2px;
      border-radius:9999px;opacity:0;
      transition:opacity 0.3s;z-index:-1;
    }
    .btn-brand{background:linear-gradient(135deg,#e50914,#ff4d5a);color:white;}
    .btn-brand::after{background:linear-gradient(135deg,#e50914,#ff4d5a);filter:blur(15px);}
    .btn-brand:hover::after{opacity:0.5;}
    .btn-brand:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(229,9,20,0.35);}
    .btn-accent{background:linear-gradient(135deg,#16a34a,#4ade80);color:white;}
    .btn-accent::after{background:linear-gradient(135deg,#16a34a,#4ade80);filter:blur(15px);}
    .btn-accent:hover::after{opacity:0.5;}
    .btn-accent:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(34,197,94,0.35);}
    .btn-sky{background:linear-gradient(135deg,#0284c7,#38bdf8);color:white;}
    .btn-sky::after{background:linear-gradient(135deg,#0284c7,#38bdf8);filter:blur(15px);}
    .btn-sky:hover::after{opacity:0.5;}
    .btn-sky:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(56,189,248,0.35);}
    .btn-danger{background:linear-gradient(135deg,#dc2626,#f87171);color:white;}
    .btn-danger::after{background:linear-gradient(135deg,#dc2626,#f87171);filter:blur(15px);}
    .btn-danger:hover::after{opacity:0.5;}
    .btn-danger:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(220,38,38,0.35);}

    .btn-ghost{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      color:var(--text-primary);
      backdrop-filter:blur(10px);
    }
    .btn-ghost:hover{
      background:rgba(255,255,255,0.1);
      border-color:rgba(255,255,255,0.2);
      transform:translateY(-2px);
      box-shadow:0 8px 25px rgba(0,0,0,0.25);
    }

    .btn-cloud{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      color:var(--text-primary);
    }

    .btn-neon:active,.btn-cloud:active,.btn-ghost:active{
      transform:translateY(0) scale(0.98)!important;
      transition-duration:0.1s;
    }

    .pill-button{border-radius:9999px;}

    .divider-glow{
      height:1px;
      background:linear-gradient(90deg,transparent,var(--glass-border),transparent);
      border:none;margin:16px 0;
    }

    .editing{
      background-color:rgba(234,179,8,0.2)!important;
      border:1px solid rgba(234,179,8,0.5)!important;
      border-radius:6px;outline:none;
      animation:editPulse 2s ease-in-out infinite;
    }
    @keyframes editPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,0.3);}
      50%{box-shadow:0 0 12px 2px rgba(234,179,8,0.25);}
    }

    .data-table{border-collapse:separate;border-spacing:0;}
    .data-table thead th{
      background:rgba(255,255,255,0.04);
      border-bottom:1px solid var(--glass-border);
      font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.08em;
      color:var(--text-muted);
      padding:10px 8px;
      position:sticky;top:0;z-index:5;
      backdrop-filter:blur(10px);
    }
    .data-table tbody td{
      border-bottom:1px solid var(--glass-border);
      padding:8px;font-size:12px;
      transition:background 0.2s;
    }
    .data-table tbody tr:hover td{background:rgba(255,255,255,0.03);}
    .data-table tbody tr:last-child td{border-bottom:none;}

    .totals-row{
      background:rgba(255,255,255,0.02);
      border:1px solid var(--glass-border);
    }
    .totals-row td{
      font-weight:600;font-size:11px;
      color:var(--text-muted);padding:8px 10px;
    }

    .text-gradient{
      background:linear-gradient(135deg,#fff,#94a3b8,#00d4ff,#a855f7,#fff);
      background-size:300% 300%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:gradientShift 8s ease-in-out infinite;
    }
    @keyframes gradientShift{
      0%,100%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
    }

    .status-dot{
      width:8px;height:8px;border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 10px rgba(34,197,94,0.6);
      animation:statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse{
      0%,100%{opacity:1;box-shadow:0 0 10px rgba(34,197,94,0.6);}
      50%{opacity:0.6;box-shadow:0 0 20px rgba(34,197,94,0.9);}
    }

    .modal-backdrop{
      background:rgba(0,0,0,0.65);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    }
    .modal-glass{
      background-color:var(--glass-bg);
      backdrop-filter:blur(40px) saturate(180%);
      -webkit-backdrop-filter:blur(40px) saturate(180%);
      border:1px solid var(--glass-border);
      box-shadow:0 30px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .animate-slide-up{animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;}
    .animate-slide-down{animation:slideDown 0.5s cubic-bezier(0.16,1,0.3,1) both;}
    .animate-scale-in{animation:scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) both;}
    @keyframes slideUp{0%{opacity:0;transform:translateY(30px) scale(0.97);}100%{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes slideDown{0%{opacity:0;transform:translateY(-20px);}100%{opacity:1;transform:translateY(0);}}
    @keyframes scaleIn{0%{opacity:0;transform:scale(0.9);}100%{opacity:1;transform:scale(1);}}

  <script>
    // THEME SYSTEM
    let themePanelOpen = false;
    function toggleThemePanel() {
      themePanelOpen = !themePanelOpen;
      document.getElementById('themePanel').classList.toggle('open', themePanelOpen);
    }
    function applyTheme(theme) {
      const body = document.body;
      body.classList.add('theme-transition');
      body.setAttribute('data-theme', theme);
      ['cosmic','forest','sunset','arctic'].forEach(t => {
        const b = document.getElementById('btn-' + t);
        if (b) b.classList.toggle('active', t === theme);
      });
      const icons = { cosmic:'🌌', forest:'🌿', sunset:'🌅', arctic:'❄️' };
      document.getElementById('themeTabIcon').textContent = icons[theme] || '🎨';
      try { localStorage.setItem('ui-theme', theme); } catch {}
      setTimeout(() => body.classList.remove('theme-transition'), 600);
      setTimeout(() => {
        themePanelOpen = false;
        document.getElementById('themePanel').classList.remove('open');
      }, 800);
    }
    (function() {
      let saved = null;
      try { saved = localStorage.getItem('ui-theme'); } catch {}
      const valid = ['cosmic','forest','sunset','arctic'];
      applyTheme(valid.includes(saved) ? saved : 'cosmic');
    })();
  </script>

    function compareByPriceThenBrand(a, b) {
      const pa = Number(a[RECORD.PRICE]) || 0;
      const pb = Number(b[RECORD.PRICE]) || 0;
      if (pa !== pb) return pa - pb;
      const ba = (a[RECORD.BRAND] || "").toLowerCase();
      const bb = (b[RECORD.BRAND] || "").toLowerCase();
      return ba.localeCompare(bb);
    }
    function compareObjByPriceThenBrand(x, y) {
      return compareByPriceThenBrand(x.rec || x.r, y.rec || y.r);
    }
    function findPrice(brand, ml) {
      const b = (brand || "").trim().toLowerCase();
      const m = Number(ml) || 0;
      if (!b || !m) return null;
      const match = PRICELIST.find(x => x.brand.toLowerCase() === b && x.ml === m);
      return match ? match.price : null;
    }

    function loadRecords() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_RECORDS);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) records = parsed;
      } catch (e) {
        console.error("Failed to load records", e);
        records = [];
      }
    }
    function saveRecords() {
      try {
        localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      } catch (e) {
        console.error("Failed to save records", e);
      }

    function saveAllFromAllTables() {
      const tables = $$("#groups .data-table");

      GROUPS.forEach((g, groupIndex) => {
        const groupRows = records
          .map((rec, idx) => ({ rec, idx }))
          .filter(x => g.filter(x.rec))
          .sort(compareObjByPriceThenBrand);

        if (!groupRows.length) return;
        const table = tables[groupIndex];
        if (!table) return;

        let gi = 0;
        table.querySelectorAll("tbody tr").forEach(rowEl => {
          const cells = rowEl.querySelectorAll("td");
          if (cells.length < 9 || gi >= groupRows.length) return;

          const obCell    = cells[3];
          const salesCell = cells[5];
          const priceCell = cells[6];

          obCell.contentEditable = "false";
          salesCell.contentEditable = "false";
          obCell.classList.remove("editing");
          salesCell.classList.remove("editing");

          const newOB    = Number(obCell.textContent || 0);
          const newSales = Number(salesCell.textContent || 0);
          const price    = Number((priceCell.textContent || "").replace("₹", "")) || 0;
          const newCB    = newOB - newSales;

          const rec = records[groupRows[gi].idx];
          rec[RECORD.OB]    = newOB;
          rec[RECORD.SALES] = newSales;
          rec[RECORD.CB]    = newCB;
          rec[RECORD.SV]    = price * newSales;
          rec[RECORD.CBV]   = price * newCB;

          gi++;
        });
      });

      saveRecords();
      renderGroupedTables();
      editAllActive = false;
      saveAllBtn.style.display = "none";
      editAllBtn.style.display = "inline-flex";
    }

    function saveSingleGroup(idx) {
      const tables = $$("#groups .data-table");
      const table = tables[idx];
      if (!table) return;

      const g = GROUPS[idx];
      const groupRows = records
        .map((r, i) => ({ r, idx: i }))
        .filter(x => g.filter(x.r))
        .sort((a, b) => compareByPriceThenBrand(a.r, b.r));

      let gi = 0;
      table.querySelectorAll("tbody tr").forEach(rowEl => {
        const cells = rowEl.querySelectorAll("td");
        if (cells.length < 9 || gi >= groupRows.length) return;

        const obCell = cells[3];
        const cbCell = cells[4];

        obCell.contentEditable = "false";
        cbCell.contentEditable = "false";
        obCell.classList.remove("editing");
        cbCell.classList.remove("editing");

        const newOB = Number(obCell.textContent || 0);
        const newCB = Number(cbCell.textContent || 0);
        const rec   = records[groupRows[gi].idx];

        rec[RECORD.OB]    = newOB;
        rec[RECORD.CB]    = newCB;
        rec[RECORD.SALES] = newOB - newCB;
        rec[RECORD.SV]    = rec[RECORD.PRICE] * rec[RECORD.SALES];
        rec[RECORD.CBV]   = rec[RECORD.PRICE] * rec[RECORD.CB];

        gi++;
      });

      saveRecords();
      renderGroupedTables();
      currentEditGroupIndex = null;
      saveAllBtn.style.display = "none";
      editAllBtn.style.display = "inline-flex";
    }

    form.addEventListener("submit", e => {
      e.preventDefault();

      const brand = brandInput.value.trim();
      const ml    = Number(mlSelect.value) || 0;
      const ob    = Number(obInput.value) || 0;
      const cb    = Number(cbInput.value) || 0;
      let price   = Number(priceInput.value) || 0;

      if (!brand || !ml) {
        alert("Please select Brand + ML.");
        return;
      }

      if (!price) {
        const auto = findPrice(brand, ml);
        if (auto != null) price = auto;
      }
      if (!price) {
        alert("Price missing. Check price list or enter manually.");
        return;
      }

      const sales = ob - cb;
      const sv    = price * sales;
      const cbv   = price * cb;

      const newRecord = [brand, ml, ob, cb, sales, price, sv, cbv];
      const groupIndex = GROUPS.findIndex(g => g.filter(newRecord));
      if (groupIndex === -1) {
        alert("This record doesn't match any table rules.");
        return;
      }

      const editIndexStr = localStorage.getItem(STORAGE_KEY_EDIT_IDX);
      if (editIndexStr !== null) {
        const idx = Number(editIndexStr);
        if (!Number.isNaN(idx) && idx >= 0 && idx < records.length) {
          records[idx] = newRecord;
        }
        localStorage.removeItem(STORAGE_KEY_EDIT_IDX);
        alert("Row updated successfully.");
      } else {
        const lowerBrand = brand.toLowerCase();
        const duplicate = records.some(r =>
          GROUPS[groupIndex].filter(r) &&
          (r[RECORD.BRAND] || "").toLowerCase() === lowerBrand
        );
        if (duplicate) {
          alert(`"${brand}" already exists in Table ${groupIndex + 1}.`);
          return;
        }
        records.push(newRecord);
      }

      saveRecords();
      renderGroupedTables();
      form.reset();
      datalist.innerHTML = "";
    });

    eraseBtn.addEventListener("click", () => {
      eraseFormBox.style.display = eraseFormBox.style.display === "none" ? "block" : "none";
    });

    $("#eraseSubmit").addEventListener("click", () => {
      const tno = Number(eraseTableNo.value);
      const rno = Number(eraseRowNo.value);

      if (!Number.isInteger(tno) || tno < 1 || tno > 8) {
        alert("Enter table number 1 to 8");
        return;
      }
      if (!Number.isInteger(rno) || rno < 1) {
        alert("Enter row number");
        return;
      }

      const g = GROUPS[tno - 1];
      const tableRows = records
        .map((rec, idx) => ({ rec, idx }))
        .filter(x => g.filter(x.rec))
        .sort(compareObjByPriceThenBrand);

      if (!tableRows.length) {
        alert("No records in this table");
        return;
      }
      if (rno > tableRows.length) {
        alert(`Only ${tableRows.length} rows`);
        return;
      }

      records.splice(tableRows[rno - 1].idx, 1);
      saveRecords();
      renderGroupedTables();
      eraseTableNo.value = "";
      eraseRowNo.value = "";
    });

    muhilBtn.addEventListener("click", () => {
      const tableNo = Number(prompt("Enter Table Number to edit:"));
      if (!tableNo) return;
      const rowNo   = Number(prompt("Enter Row Number to edit:"));
      if (!rowNo) return;

      if (!Number.isInteger(tableNo) || tableNo < 1 || tableNo > 8 || !Number.isInteger(rowNo) || rowNo < 1) {
        alert("Invalid table/row.");
        return;
      }

      const g = GROUPS[tableNo - 1];
      const gr = records
        .map((r, idx) => ({ r, idx }))
        .filter(o => g.filter(o.r))
        .sort((a, b) => compareByPriceThenBrand(a.r, b.r));

      if (!gr.length) {
        alert("No records.");
        return;
      }
      if (rowNo > gr.length) {
        alert(`Only ${gr.length} rows.`);
        return;
      }

      const target = gr[rowNo - 1];
      brandInput.value = target.r[RECORD.BRAND];
      mlSelect.value   = target.r[RECORD.ML];
      obInput.value    = target.r[RECORD.OB];
      cbInput.value    = target.r[RECORD.CB];
      priceInput.value = target.r[RECORD.PRICE];

      localStorage.setItem(STORAGE_KEY_EDIT_IDX, String(target.idx));
      alert("Row loaded. Edit and Submit.");
    });

    function clearAll() {
      if (!confirm("Clear all records?")) return;
      const text = prompt('Type "yes" to confirm:');
      if (!text || text.toLowerCase() !== "yes") {
        alert("Cancelled.");
        return;
      }
      records = [];
      localStorage.removeItem(STORAGE_KEY_RECORDS);
      localStorage.removeItem(STORAGE_KEY_EDIT_IDX);
      renderGroupedTables();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCYBSq_NTLy0lqcL1bXd3iGtjr16fZEvBA",
      authDomain: "store-45bb2.firebaseapp.com",
      projectId: "store-45bb2",
      storageBucket: "store-45bb2.firebasestorage.app",
      messagingSenderId: "385087942859",
      appId: "1:385087942859:web:47de5f5375550a26bb6b4e",
      measurementId: "G-V7PY6W7VND"
    };

    firebase.initializeApp(firebaseConfig);
    const auth     = firebase.auth();
    const db       = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    function updateLoginUI(user) {
      const loginBtns  = [loginBtn, loginBtnMobile];
      const logoutBtns = [logoutBtn, logoutBtnMobile];

      if (user) {
        const label = user.email || user.displayName || user.uid;
        userStatus.textContent = label;
        userHint.textContent   = "Signed in";
        userAvatar.textContent = (label[0] || "?").toUpperCase();
        loginBtns.forEach(b => b && (b.style.display = "none"));
        logoutBtns.forEach(b => b && (b.style.display = "inline-flex"));
      } else {
        userStatus.textContent = "Not Logged In";
        userHint.textContent   = "Tap login to connect";
        userAvatar.textContent = "?";
        loginBtns.forEach(b => b && (b.style.display = "inline-flex"));
        logoutBtns.forEach(b => b && (b.style.display = "none"));
      }
    }

    auth.onAuthStateChanged(user => {
      currentUser = user || null;
      updateLoginUI(currentUser);
    });

    const signIn  = () => auth.signInWithPopup(provider).catch(console.error);
    const signOut = () => auth.signOut().catch(console.error);

    if (loginBtn)       loginBtn.onclick       = signIn;
    if (loginBtnMobile) loginBtnMobile.onclick = signIn;
    if (logoutBtn)      logoutBtn.onclick      = signOut;
    if (logoutBtnMobile)logoutBtnMobile.onclick= signOut;

    nextDayBtn.onclick = () => {
      if (!records.length) {
        alert("Table is empty.");
        return;
      }
      if (!confirm("Next Day? OB = previous CB.")) return;

      records = records.map(r => {
        const oldCB = Number(r[RECORD.CB]) || 0;
        const price = Number(r[RECORD.PRICE]) || 0;
        return [
          r[RECORD.BRAND],
          r[RECORD.ML],
          oldCB,
          oldCB,
          0,
          price,
          0,
          price * oldCB
        ];
      });

      saveRecords();
      renderGroupedTables();
      alert("Next day applied.");
    };

    async function storeToCloud() {
      if (!currentUser) {
        alert("Please login first.");
        return;
      }
      if (!records.length) {
        alert("No data to store.");
        return;
      }

      const listName = prompt("Report name:", new Date().toLocaleDateString());
      if (!listName) return;

      const data = records.map(r => ({
        brand: r[RECORD.BRAND],
        ml:    r[RECORD.ML],
        ob:    r[RECORD.OB],
        cb:    r[RECORD.CB],
        sales: r[RECORD.SALES],
        price: r[RECORD.PRICE],
        sv:    r[RECORD.SV],
        cbv:   r[RECORD.CBV],
      }));

      try {
        await db.collection("users")
          .doc(currentUser.uid)
          .collection("reports")
          .add({
            name: listName,
            data,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          });
        alert("Saved to cloud.");
      } catch (e) {
        console.error(e);
        alert("Error: " + e.message);
      }
    }
    storeCloudBtn.onclick = storeToCloud;

    async function showCloudLists() {
      if (!currentUser) {
        alert("Please login first.");
        return;
      }

      listModal.style.display = "flex";
      cloudDataList.textContent = "Loading...";

      try {
        const snap = await db.collection("users")
          .doc(currentUser.uid)
          .collection("reports")
          .orderBy("timestamp", "desc")
          .get();

        if (snap.empty) {
          cloudDataList.textContent = "No cloud reports found.";
          return;
        }

        cloudDataList.innerHTML = "";
        snap.forEach(docSnap => {
          const d = docSnap.data();
          const div = document.createElement("div");
          div.className = "flex items-center justify-between glass-chip rounded-xl px-3 py-2";
          div.innerHTML = `
            <div>
              <span class="font-semibold" style="color:var(--text-primary);">${d.name || "(no name)"}</span>
              <span class="text-xs ml-2" style="color:var(--text-muted);">${(d.data || []).length} rows</span>
            </div>
            <button class="btn-neon btn-brand pill-button px-3 py-1.5 text-[11px] font-semibold"
              data-load-id="${docSnap.id}">
              Load
            </button>`;
          cloudDataList.appendChild(div);
        });

        cloudDataList.onclick = e => {
          const btn = e.target.closest("button[data-load-id]");
          if (!btn) return;
          loadCloudReport(btn.dataset.loadId);
        };
      } catch (e) {
        console.error(e);
        cloudDataList.textContent = "Error: " + e.message;
      }
    }
    listBtn.onclick = showCloudLists;

    async function loadCloudReport(id) {
      if (!currentUser) {
        alert("Please login first.");
        return;
      }
      if (!confirm("Overwrite current data?")) return;

      try {
        const docSnap = await db.collection("users")
          .doc(currentUser.uid)
          .collection("reports")
          .doc(id)
          .get();

        if (!docSnap.exists) {
          alert("Report not found.");
          return;
        }

        const data = docSnap.data().data || [];
        records = data.map(o => [
          o.brand,
          o.ml,
          o.ob,
          o.cb,
          o.sales,
          o.price,
          o.sv,
          o.cbv,
        ]);

        saveRecords();
        renderGroupedTables();
        listModal.style.display = "none";
      } catch (e) {
        console.error(e);
        alert("Error: " + e.message);
      }
    }
    window.loadCloudReport = loadCloudReport;

    loadRecords();
    renderBrandOptions("");
    renderGroupedTables();
  </script>
</body>
</html>
