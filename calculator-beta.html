<!doctype html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <title>Ⓜ️GROUPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              400: '#ff4d5a',
              500: '#e50914',
              600: '#cf0813',
              700: '#b20710',
            },
            accent: {
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
            },
            neon: {
              blue: '#00d4ff',
              purple: '#a855f7',
              pink: '#ec4899',
              cyan: '#22d3ee',
            }
          },
          boxShadow: {
            soft: '0 22px 55px rgba(0,0,0,0.75)',
            glow: '0 0 40px rgba(0,212,255,0.15)',
            'glow-brand': '0 0 40px rgba(229,9,20,0.2)',
            'glow-accent': '0 0 40px rgba(34,197,94,0.2)',
            'inner-glow': 'inset 0 1px 0 rgba(255,255,255,0.1)',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 2s infinite',
            'float-slow': 'float 8s ease-in-out 1s infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
            'shimmer': 'shimmer 3s ease-in-out infinite',
            'gradient-shift': 'gradientShift 8s ease-in-out infinite',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16,1,0.3,1)',
            'slide-down': 'slideDown 0.5s cubic-bezier(0.16,1,0.3,1)',
            'fade-in': 'fadeIn 0.5s ease-out',
            'scale-in': 'scaleIn 0.4s cubic-bezier(0.16,1,0.3,1)',
            'blur-in': 'blurIn 0.6s ease-out',
            'ripple': 'ripple 0.6s ease-out',
            'spin-slow': 'spin 20s linear infinite',
            'bounce-subtle': 'bounceSubtle 2s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '33%': { transform: 'translateY(-12px) rotate(1deg)' },
              '66%': { transform: 'translateY(8px) rotate(-1deg)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.05)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            gradientShift: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(30px) scale(0.97)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.9)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            blurIn: {
              '0%': { opacity: '0', filter: 'blur(10px)' },
              '100%': { opacity: '1', filter: 'blur(0)' },
            },
            ripple: {
              '0%': { transform: 'scale(0)', opacity: '0.5' },
              '100%': { transform: 'scale(4)', opacity: '0' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
          },
        }
      }
    }
  </script>

  <style>
    /* ══════════════════════════════════════════════
       COSMIC BACKGROUND SYSTEM
    ══════════════════════════════════════════════ */
    body {
      background: #050510;
      position: relative;
      overflow-x: hidden;
    }

    .bg-cosmos {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-cosmos .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: orbDrift 25s ease-in-out infinite;
    }

    .bg-cosmos .orb:nth-child(1) {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(229,9,20,0.4), transparent 70%);
      top: -15%; left: -10%;
      animation-duration: 30s;
    }
    .bg-cosmos .orb:nth-child(2) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,212,255,0.3), transparent 70%);
      top: 40%; right: -15%;
      animation-delay: -8s;
      animation-duration: 28s;
    }
    .bg-cosmos .orb:nth-child(3) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%);
      bottom: -10%; left: 25%;
      animation-delay: -15s;
      animation-duration: 32s;
    }
    .bg-cosmos .orb:nth-child(4) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(236,72,153,0.25), transparent 70%);
      top: 20%; left: 50%;
      animation-delay: -20s;
      animation-duration: 35s;
    }
    .bg-cosmos .orb:nth-child(5) {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(34,211,238,0.2), transparent 70%);
      bottom: 30%; right: 30%;
      animation-delay: -12s;
      animation-duration: 26s;
    }

    @keyframes orbDrift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(80px, -60px) scale(1.1); }
      50% { transform: translate(-50px, 80px) scale(0.9); }
      75% { transform: translate(60px, 30px) scale(1.05); }
    }

    /* Grid overlay */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-size: 80px 80px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }

    /* Noise */
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      animation: particleFloat linear infinite;
    }
    .particle:nth-child(1) { width:2px;height:2px;left:8%;animation-duration:14s;animation-delay:0s; }
    .particle:nth-child(2) { width:3px;height:3px;left:18%;animation-duration:18s;animation-delay:-3s;opacity:0.4; }
    .particle:nth-child(3) { width:2px;height:2px;left:32%;animation-duration:12s;animation-delay:-7s; }
    .particle:nth-child(4) { width:4px;height:4px;left:45%;animation-duration:20s;animation-delay:-2s;opacity:0.3; }
    .particle:nth-child(5) { width:2px;height:2px;left:58%;animation-duration:15s;animation-delay:-9s; }
    .particle:nth-child(6) { width:3px;height:3px;left:72%;animation-duration:16s;animation-delay:-5s;opacity:0.5; }
    .particle:nth-child(7) { width:2px;height:2px;left:85%;animation-duration:13s;animation-delay:-11s; }
    .particle:nth-child(8) { width:3px;height:3px;left:92%;animation-duration:17s;animation-delay:-4s;opacity:0.35; }
    .particle:nth-child(9) { width:2px;height:2px;left:50%;animation-duration:19s;animation-delay:-13s; }
    .particle:nth-child(10){ width:4px;height:4px;left:25%;animation-duration:22s;animation-delay:-6s;opacity:0.2; }

    @keyframes particleFloat {
      0% { transform: translateY(105vh) scale(0); opacity: 0; }
      8% { opacity: 1; transform: translateY(92vh) scale(1); }
      92% { opacity: 0.4; }
      100% { transform: translateY(-5vh) translateX(30px) scale(0.3); opacity: 0; }
    }

    /* ══════════════════════════════════════════════
       ULTRA GLASS MORPHISM
    ══════════════════════════════════════════════ */
    .glass-ultra {
      background:
        radial-gradient(ellipse at top left, rgba(255,255,255,0.08), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(0,212,255,0.06), transparent 50%);
      background-color: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    .glass-header {
      background:
        linear-gradient(135deg, rgba(10,15,30,0.9) 0%, rgba(15,20,40,0.85) 100%);
      backdrop-filter: blur(50px) saturate(200%);
      -webkit-backdrop-filter: blur(50px) saturate(200%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 -1px 0 rgba(255,255,255,0.05);
    }

    .glass-card {
      background:
        radial-gradient(ellipse at top, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(ellipse at bottom right, rgba(168,85,247,0.04), transparent 60%);
      background-color: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .glass-card:hover {
      border-color: rgba(255,255,255,0.12);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.5),
        0 0 40px rgba(0,212,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    .glass-chip {
      background:
        radial-gradient(ellipse at top, rgba(255,255,255,0.1), transparent 50%);
      background-color: rgba(15, 20, 40, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow:
        0 4px 16px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .glass-input {
      background: rgba(5, 10, 25, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.03);
      transition: all 0.3s ease;
    }

    .glass-input:focus {
      border-color: rgba(0,212,255,0.5);
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.4),
        0 0 20px rgba(0,212,255,0.15),
        0 0 40px rgba(0,212,255,0.05);
    }

    .glass-table {
      background: rgba(8, 12, 25, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow:
        0 15px 40px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* ══════════════════════════════════════════════
       NEON BUTTONS
    ══════════════════════════════════════════════ */
    .btn-neon {
      position: relative;
      overflow: hidden;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .btn-neon::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }

    .btn-neon:hover::before {
      left: 100%;
    }

    .btn-neon::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 9999px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }

    .btn-brand { background: linear-gradient(135deg, #e50914, #ff4d5a); color: white; }
    .btn-brand::after { background: linear-gradient(135deg, #e50914, #ff4d5a); filter: blur(15px); }
    .btn-brand:hover::after { opacity: 0.5; }
    .btn-brand:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(229,9,20,0.3); }

    .btn-accent { background: linear-gradient(135deg, #16a34a, #4ade80); color: white; }
    .btn-accent::after { background: linear-gradient(135deg, #16a34a, #4ade80); filter: blur(15px); }
    .btn-accent:hover::after { opacity: 0.5; }
    .btn-accent:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(34,197,94,0.3); }

    .btn-sky { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; }
    .btn-sky::after { background: linear-gradient(135deg, #0284c7, #38bdf8); filter: blur(15px); }
    .btn-sky:hover::after { opacity: 0.5; }
    .btn-sky:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(56,189,248,0.3); }

    .btn-danger { background: linear-gradient(135deg, #dc2626, #f87171); color: white; }
    .btn-danger::after { background: linear-gradient(135deg, #dc2626, #f87171); filter: blur(15px); }
    .btn-danger:hover::after { opacity: 0.5; }
    .btn-danger:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(220,38,38,0.3); }

    .btn-ghost {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      backdrop-filter: blur(10px);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn-cloud {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      position: relative;
      overflow: hidden;
    }
    .btn-cloud::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.6s ease;
    }
    .btn-cloud:hover::before { left: 100%; }
    .btn-cloud:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    /* Active press effect */
    .btn-neon:active,
    .btn-cloud:active,
    .btn-ghost:active {
      transform: translateY(0) scale(0.98) !important;
      transition-duration: 0.1s;
    }

    /* ══════════════════════════════════════════════
       PILL BUTTON (legacy compat)
    ══════════════════════════════════════════════ */
    .pill-button { border-radius: 9999px; }

    /* ══════════════════════════════════════════════
       SEPARATOR / DIVIDERS
    ══════════════════════════════════════════════ */
    .divider-glow {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      border: none;
      margin: 16px 0;
    }

    /* ══════════════════════════════════════════════
       EDITING HIGHLIGHT
    ══════════════════════════════════════════════ */
    .editing {
      background-color: rgba(234, 179, 8, 0.2) !important;
      border: 1px solid rgba(234, 179, 8, 0.4) !important;
      border-radius: 6px;
      outline: none;
      animation: editPulse 2s ease-in-out infinite;
    }

    @keyframes editPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234,179,8,0.3); }
      50% { box-shadow: 0 0 12px 2px rgba(234,179,8,0.2); }
    }

    /* ══════════════════════════════════════════════
       TABLE STYLES
    ══════════════════════════════════════════════ */
    .data-table {
      border-collapse: separate;
      border-spacing: 0;
    }

    .data-table thead th {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5);
      padding: 10px 8px;
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .data-table tbody td {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      transition: background 0.2s;
    }

    .data-table tbody tr:hover td {
      background: rgba(255,255,255,0.03);
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ══════════════════════════════════════════════
       SCROLLBAR
    ══════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ══════════════════════════════════════════════
       ANIMATED GRADIENT TEXT
    ══════════════════════════════════════════════ */
    .text-gradient {
      background: linear-gradient(135deg, #fff, #94a3b8, #00d4ff, #a855f7, #fff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 8s ease-in-out infinite;
    }

    .text-gradient-brand {
      background: linear-gradient(135deg, #ff4d5a, #e50914, #ff7eb3, #e50914);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 6s ease-in-out infinite;
    }

    /* ══════════════════════════════════════════════
       STATUS DOT
    ══════════════════════════════════════════════ */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.6), 0 0 20px rgba(34,197,94,0.3);
      animation: statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(34,197,94,0.6); }
      50% { opacity: 0.6; box-shadow: 0 0 20px rgba(34,197,94,0.8); }
    }

    /* ══════════════════════════════════════════════
       LABEL CHIP
    ══════════════════════════════════════════════ */
    .chip-glow {
      position: relative;
      overflow: hidden;
    }
    .chip-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% 100%;
    }

    /* ══════════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════════ */
    .modal-backdrop {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-glass {
      background:
        radial-gradient(ellipse at top, rgba(255,255,255,0.06), transparent 60%);
      background-color: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* ══════════════════════════════════════════════
       STAGGER ANIMATION CHILDREN
    ══════════════════════════════════════════════ */
    .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
    .stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
    .stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
    .stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
    .stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
    .stagger-children > *:nth-child(7) { animation-delay: 0.35s; }

    function printReport() {
      renderGroupedTables();
      window.print();

    const BRANDS = [...new Set(PRICELIST.map(x => x.brand))].sort();
    const STORAGEKEY = "calcrecords";
    let records = [];

    function loadData() {
      const saved = localStorage.getItem(STORAGEKEY);
      if (saved) records = JSON.parse(saved);
    }
    function saveData() {
      localStorage.setItem(STORAGEKEY, JSON.stringify(records));
    }

    const form = document.getElementById("information");
    const brandInput = document.getElementById("brand");
    const mlSelect = document.getElementById("ml");
    const priceInput = document.getElementById("price");
    const datalist = document.getElementById("suggestions");

    brandInput.setAttribute("list", "suggestions");

    function renderBrandOptions(filterText) {
      datalist.innerHTML = "";
      const q = (filterText || "").toLowerCase();
      BRANDS
        .filter(b => b.toLowerCase().includes(q))
        .slice(0, 30)
        .forEach(b => {
          const opt = document.createElement("option");
          opt.value = b;
          datalist.appendChild(opt);
        });
    }

    function autoApplyPrice() {
      const brand = brandInput.value.trim();
      const ml = parseFloat(mlSelect.value || 0);
      if (!brand || !ml) return;
      const match = PRICELIST.find(x => x.brand === brand && x.ml === ml);
      priceInput.value = match ? match.price : "";
    }

    brandInput.addEventListener("input", () => {
      renderBrandOptions(brandInput.value);
      autoApplyPrice();
    });
    brandInput.addEventListener("focus", () => renderBrandOptions(brandInput.value));
    mlSelect.addEventListener("change", autoApplyPrice);

    function money(n) { return (Number(n) || 0).toFixed(2); }
    function sumField(arr, idx) { return arr.reduce((a, r) => a + (Number(r[idx]) || 0), 0); }

    function compareByPriceThenBrand(a, b) {
      const priceA = Number(a[5]);
      const priceB = Number(b[5]);
      if (priceA !== priceB) return priceA - priceB;
      return (a[0] || "").toLowerCase().localeCompare((b[0] || "").toLowerCase());
    }
    function compareObjByPriceThenBrand(x, y) {
      const ra = x.rec || x.r;
      const rb = y.rec || y.r;
      return compareByPriceThenBrand(ra, rb);
    }

    const GROUPS = [
      { key: "180_140",   title: "Table 1: 180 ml (Price ≤ 140)", filter: r => r[1] === 180 && r[5] <= 140 },
      { key: "180_170",   title: "Table 2: 180 ml (Price = 170)",  filter: r => r[1] === 180 && r[5] === 170 },
      { key: "180_gt200", title: "Table 3: 180 ml (Price ≥ 200)", filter: r => r[1] === 180 && r[5] >= 200 },
      { key: "375",  title: "Table 4: 375 ml",  filter: r => r[1] === 375 },
      { key: "750",  title: "Table 5: 750 ml",  filter: r => r[1] === 750 },
      { key: "1000", title: "Table 6: 1000 ml", filter: r => r[1] === 1000 },
      { key: "650",  title: "Table 7: 650 ml",  filter: r => r[1] === 650 },
      { key: "500",  title: "Table 8: 500 ml",  filter: r => r[1] === 500 }
    ];

    // ══════════════════════════════════════════════
    // RENDER TABLES (ultra glass style)
    // ══════════════════════════════════════════════
    function renderGroupedTables() {
      const host = document.getElementById("groups");
      host.innerHTML = "";

      let t9OB = 0, t9CB = 0, t9Sales = 0, t9SV = 0, t9CBV = 0;
      let t10OB = 0, t10CB = 0, t10Sales = 0, t10SV = 0, t10CBV = 0;

      GROUPS.forEach((g, idx) => {
        const rows = records.filter(g.filter).slice().sort(compareByPriceThenBrand);

        const totalOB = sumField(rows, 2);
        const totalCB = sumField(rows, 3);
        const totalSales = sumField(rows, 4);
        const totalSV = sumField(rows, 6);
        const totalCBV = sumField(rows, 7);

        if (idx <= 5) { t9OB += totalOB; t9CB += totalCB; t9Sales += totalSales; t9SV += totalSV; t9CBV += totalCBV; }
        if (idx >= 6) { t10OB += totalOB; t10CB += totalCB; t10Sales += totalSales; t10SV += totalSV; t10CBV += totalCBV; }

        // Section wrapper
        const section = document.createElement("div");
        section.className = "animate-slide-up";
        section.style.animationDelay = (0.05 * idx) + "s";

        // Title
        const title = document.createElement("h2");
        title.className = "groupTitle text-xs font-display font-bold tracking-tight text-slate-300 mb-2 flex items-center gap-2";
        title.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-neon-cyan animate-pulse"></span>${g.title}`;
        section.appendChild(title);

        // Table wrapper
        const tableWrap = document.createElement("div");
        tableWrap.className = "glass-table rounded-2xl overflow-hidden overflow-x-auto mb-1";

        const t = document.createElement("table");
        t.className = "data-table w-full text-left";
        t.innerHTML = `
          <thead>
            <tr>
              <th class="w-10">#</th>
              <th>Brand</th>
              <th class="w-14">ML</th>
              <th class="w-12">OB</th>
              <th class="w-12">CB</th>
              <th class="w-14">Sales</th>
              <th class="w-14">Price</th>
              <th class="w-20">Sales Val</th>
              <th class="w-20">CB Val</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length === 0
              ? `<tr><td colspan="9" class="text-center text-slate-600 py-6 text-xs">No records</td></tr>`
              : rows.map((r, i) => `
                <tr>
                  <td class="text-slate-500 font-mono text-[10px]">${i + 1}</td>
                  <td class="font-medium text-slate-200">${r[0]}</td>
                  <td class="text-slate-400">${r[1]}</td>
                  <td class="text-sky-300 font-semibold">${r[2]}</td>
                  <td class="text-amber-300 font-semibold">${r[3]}</td>
                  <td class="text-emerald-300 font-semibold">${r[4]}</td>
                  <td class="text-slate-300">₹${r[5]}</td>
                  <td class="text-emerald-200 font-mono text-[11px]">₹${money(r[6])}</td>
                  <td class="text-amber-200 font-mono text-[11px]">₹${money(r[7])}</td>
                </tr>
              `).join("")
            }
          </tbody>
        `;
        tableWrap.appendChild(t);
        section.appendChild(tableWrap);

        // Totals
        const totals = document.createElement("div");
        totals.className = "totals-row totalsTable rounded-xl overflow-x-auto mb-4";
        const tt = document.createElement("table");
        tt.className = "w-full";
        tt.innerHTML = `
          <tr>
            <td>OB: <span class="text-sky-300">${money(totalOB)}</span></td>
            <td>CB: <span class="text-amber-300">${money(totalCB)}</span></td>
            <td>Sales: <span class="text-emerald-300">${money(totalSales)}</span></td>
            <td>SV: <span class="text-emerald-200">₹${money(totalSV)}</span></td>
            <td>CBV: <span class="text-amber-200">₹${money(totalCBV)}</span></td>
          </tr>
        `;
        totals.appendChild(tt);
        section.appendChild(totals);

        host.appendChild(section);
      });

      // Summary tables function
      function addSummary(label, ob, cb, sales, sv, cbv, colorClass) {
        const wrap = document.createElement("div");
        wrap.className = "animate-slide-up";

        const title = document.createElement("h2");
        title.className = `groupTitle text-sm font-display font-bold tracking-tight ${colorClass} mt-5 mb-2 flex items-center gap-2`;
        title.innerHTML = `<span class="inline-block w-3 h-0.5 rounded bg-current"></span>${label}`;
        wrap.appendChild(title);

        const totals = document.createElement("div");
        totals.className = "totals-row totalsTable rounded-xl overflow-x-auto";
        const tt = document.createElement("table");
        tt.className = "w-full";
        tt.innerHTML = `
          <tr>
            <td>OB: <span class="text-sky-300">${money(ob)}</span></td>
            <td>CB: <span class="text-amber-300">${money(cb)}</span></td>
            <td>Sales: <span class="text-emerald-300">${money(sales)}</span></td>
            <td>SV: <span class="text-emerald-200">₹${money(sv)}</span></td>
            <td>CBV: <span class="text-amber-200">₹${money(cbv)}</span></td>
          </tr>
        `;
        totals.appendChild(tt);
        wrap.appendChild(totals);
        host.appendChild(wrap);
      }

      addSummary("IMSF Total", t9OB, t9CB, t9Sales, t9SV, t9CBV, "text-neon-blue");
      addSummary("BEER Total", t10OB, t10CB, t10Sales, t10SV, t10CBV, "text-amber-400");
      addSummary("Grand Total (IMSF + BEER)", t9OB+t10OB, t9CB+t10CB, t9Sales+t10Sales, t9SV+t10SV, t9CBV+t10CBV, "text-neon-purple");
    }

    // EDIT ALL / SAVE ALL
    // ══════════════════════════════════════════════
    const editAllBtn = document.getElementById("editAllBtn");
    const saveAllBtn = document.getElementById("saveAllBtn");
    let editAllActive = false;
    let currentEditGroupIndex = null;

    editAllBtn.addEventListener("click", function () {
      if (editAllActive) { alert("Already in Edit All mode. Click SAVE to finish."); return; }
      renderGroupedTables();
      const host = document.getElementById("groups");
      const tables = host.querySelectorAll(".data-table");
      tables.forEach(t => {
        const rows = t.querySelectorAll("tbody tr");
        rows.forEach(row => {
          const cells = row.querySelectorAll("td");
          if (cells.length < 9) return;
          cells[3].contentEditable = "true";
          cells[5].contentEditable = "true";
          cells[3].classList.add("editing");
          cells[5].classList.add("editing");
        });
      });
      editAllActive = true;
      editAllBtn.style.display = "none";
      saveAllBtn.style.display = "inline-flex";
    });

    function saveAllFromAllTables() {
      const host = document.getElementById("groups");
      const tables = host.querySelectorAll(".data-table");

      GROUPS.forEach((g, groupIndex) => {
        const groupRows = records
          .map((rec, idx) => ({ rec, idx }))
          .filter(x => g.filter(x.rec))
          .sort(compareObjByPriceThenBrand);
        if (groupRows.length === 0) return;
        const table = tables[groupIndex];
        if (!table) return;
        const bodyRows = table.querySelectorAll("tbody tr");
        let gi = 0;
        bodyRows.forEach(rowEl => {
          const cells = rowEl.querySelectorAll("td");
          if (cells.length < 9) return;
          cells[3].contentEditable = "false";
          cells[5].contentEditable = "false";
          cells[3].classList.remove("editing");
          cells[5].classList.remove("editing");
          const newOB = Number(cells[3].textContent || 0);
          const newSales = Number(cells[5].textContent || 0);
          const price = Number(cells[6].textContent.replace("₹","") || 0);
          const newCB = newOB - newSales;
          const newSV = price * newSales;
          const newCBV = price * newCB;
          const recIndex = groupRows[gi].idx;
          const rec = records[recIndex];
          rec[2] = newOB; rec[4] = newSales; rec[3] = newCB; rec[6] = newSV; rec[7] = newCBV;
          gi++;
        });
      });
      saveData();
      renderGroupedTables();
      editAllActive = false;
      saveAllBtn.style.display = "none";
      editAllBtn.style.display = "inline-flex";
    }

    function saveSingleGroup(idx) {
      const host = document.getElementById("groups");
      const tables = host.querySelectorAll(".data-table");
      const table = tables[idx];
      if (!table) return;
      const g = GROUPS[idx];
      const groupRows = records
        .map((r, i) => ({ r, idx: i }))
        .filter(x => g.filter(x.r))
        .sort((a,b) => compareByPriceThenBrand(a.r, b.r));
      const bodyRows = table.querySelectorAll("tbody tr");
      let gi = 0;
      bodyRows.forEach(rowEl => {
        const cells = rowEl.querySelectorAll("td");
        if (cells.length < 9) return;
        cells[3].contentEditable = "false";
        cells[4].contentEditable = "false";
        cells[3].classList.remove("editing");
        cells[4].classList.remove("editing");
        const newOB = parseFloat(cells[3].textContent || 0);
        const newCB = parseFloat(cells[4].textContent || 0);
        const recIndex = groupRows[gi].idx;
        const rec = records[recIndex];
        rec[2] = newOB; rec[3] = newCB; rec[4] = newOB - newCB;
        rec[6] = rec[5] * rec[4]; rec[7] = rec[5] * rec[3];
        gi++;
      });
      saveData();
      renderGroupedTables();
      currentEditGroupIndex = null;
      saveAllBtn.style.display = "none";
      editAllBtn.style.display = "inline-flex";
    }

    saveAllBtn.addEventListener("click", function () {
      if (editAllActive) { saveAllFromAllTables(); return; }
      if (typeof currentEditGroupIndex === "number") saveSingleGroup(currentEditGroupIndex);
    });

    // ══════════════════════════════════════════════
    // FORM SUBMIT
    // ══════════════════════════════════════════════
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const brand = brandInput.value.trim();
      const ml = parseFloat(mlSelect.value || 0);
      const ob = parseFloat(document.getElementById("ob").value || 0);
      const cb = parseFloat(document.getElementById("cb").value || 0);
      const price = parseFloat(priceInput.value || 0);
      if (!brand || !ml || !price) { alert("Please select Brand + ML. Price will auto-fill."); return; }
      const sales = ob - cb;
      const sv = price * sales;
      const cbv = price * cb;
      const newRecord = [brand, ml, ob, cb, sales, price, sv, cbv];
      const groupIndex = GROUPS.findIndex(g => g.filter(newRecord));
      if (groupIndex === -1) { alert("This record doesn't match any table rules."); return; }

      const editIndexStr = localStorage.getItem("editIndex");
      const isEditing = editIndexStr !== null;
      const editIndex = isEditing ? parseInt(editIndexStr, 10) : -1;

      if (isEditing) {
        records[editIndex] = newRecord;
        localStorage.removeItem("editIndex");
        alert("Row updated successfully.");
      } else {
        const dup = records.some(r => GROUPS[groupIndex].filter(r) && (r[0]||"").toLowerCase() === brand.toLowerCase());
        if (dup) { alert('"' + brand + '" already exists in Table ' + (groupIndex+1) + '.'); return; }
        records.push(newRecord);
      }
      saveData();
      renderGroupedTables();
      form.reset();
      brandInput.setAttribute("list", "suggestions");
      datalist.innerHTML = "";
    });

    // ══════════════════════════════════════════════
    // ERASE
    // ══════════════════════════════════════════════
    const eraseBtn = document.getElementById("eraseBtn");
    const eraseFormDiv = document.getElementById("eraseForm");
    const eraseSubmit = document.getElementById("eraseSubmit");

    eraseBtn.addEventListener("click", () => {
      eraseFormDiv.style.display = eraseFormDiv.style.display === "none" ? "block" : "none";
    });

    eraseSubmit.addEventListener("click", () => {
      const tno = parseInt(document.getElementById("eraseTableNo").value, 10);
      const rno = parseInt(document.getElementById("eraseRowNo").value, 10);
      if (!Number.isInteger(tno) || tno < 1 || tno > 8) { alert("Enter table number 1 to 8"); return; }
      if (!Number.isInteger(rno) || rno < 1) { alert("Enter row number"); return; }
      const g = GROUPS[tno - 1];
      const tableRows = records.map((rec, idx) => ({rec, idx})).filter(x => g.filter(x.rec)).sort(compareObjByPriceThenBrand);
      if (!tableRows.length) { alert("No records in this table"); return; }
      if (rno > tableRows.length) { alert("Only " + tableRows.length + " rows"); return; }
      records.splice(tableRows[rno-1].idx, 1);
      saveData();
      renderGroupedTables();
      document.getElementById("eraseTableNo").value = "";
      document.getElementById("eraseRowNo").value = "";
    });

    // ══════════════════════════════════════════════
    // EDIT SINGLE ROW
    // ══════════════════════════════════════════════
    document.getElementById("muhil").addEventListener("click", function () {
      const tableNoStr = prompt("Enter Table Number to edit:");
      if (tableNoStr === null) return;
      const rowNoStr = prompt("Enter Row Number to edit:");
      if (rowNoStr === null) return;
      const tableNo = parseInt(tableNoStr, 10);
      const rowNo = parseInt(rowNoStr, 10);
      if (!Number.isInteger(tableNo) || !Number.isInteger(rowNo) || tableNo < 1 || tableNo > 8 || rowNo < 1) { alert("Invalid."); return; }
      const g = GROUPS[tableNo - 1];
      const gr = records.map((r, idx) => ({r, idx})).filter(o => g.filter(o.r)).sort((a,b) => compareByPriceThenBrand(a.r, b.r));
      if (!gr.length) { alert("No records."); return; }
      if (rowNo > gr.length) { alert("Only " + gr.length + " rows."); return; }
      const target = gr[rowNo - 1];
      const row = target.r;
      brandInput.value = row[0]; mlSelect.value = row[1];
      document.getElementById("ob").value = row[2]; document.getElementById("cb").value = row[3];
      priceInput.value = row[5];
      localStorage.setItem("editIndex", target.idx);
      alert("Row loaded. Edit and Submit.");
    });

    // ══════════════════════════════════════════════
    // CLEAR ALL
    // ══════════════════════════════════════════════
    function clearAll() {
      if (!confirm("Clear all records?")) return;
      const text = prompt('Type "yes" to confirm:');
      if (!text || text.toLowerCase() !== "yes") { alert("Cancelled."); return; }
      records = [];
      localStorage.removeItem(STORAGEKEY);
      renderGroupedTables();
    }
    window.clearAll = clearAll;

    // ══════════════════════════════════════════════
    // FIREBASE
    // ══════════════════════════════════════════════
    const firebaseConfig = {
     apiKey: "AIzaSyCYBSq_NTLy0lqcL1bXd3iGtjr16fZEvBA",
      authDomain: "store-45bb2.firebaseapp.com",
      projectId: "store-45bb2",
      storageBucket: "store-45bb2.firebasestorage.app",
      messagingSenderId: "385087942859",
      appId: "1:385087942859:web:47de5f5375550a26bb6b4e",
      measurementId: "G-V7PY6W7VND"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();
    let currentUser = null;

    function updateLoginUI(user) {
      const status = document.getElementById("userStatus");
      const hint = document.getElementById("userHint");
      const avatar = document.getElementById("userAvatar");
      const els = {
        login: [document.getElementById("loginBtn"), document.getElementById("loginBtnMobile")],
        logout: [document.getElementById("logoutBtn"), document.getElementById("logoutBtnMobile")]
      };
      if (user) {
        const label = user.email || user.displayName || user.uid;
        status.textContent = label;
        hint.textContent = "Signed in";
        avatar.textContent = (label[0] || "?").toUpperCase();
        els.login.forEach(b => b.style.display = "none");
        els.logout.forEach(b => b.style.display = "inline-flex");
      } else {
        status.textContent = "Not Logged In";
        hint.textContent = "Tap login to connect";
        avatar.textContent = "?";
        els.login.forEach(b => b.style.display = "inline-flex");
        els.logout.forEach(b => b.style.display = "none");
      }
    }

    auth.onAuthStateChanged(user => { currentUser = user || null; updateLoginUI(currentUser); });

    document.getElementById("loginBtn").onclick =
    document.getElementById("loginBtnMobile").onclick = () => auth.signInWithPopup(provider);
    document.getElementById("logoutBtn").onclick =
    document.getElementById("logoutBtnMobile").onclick = () => auth.signOut();

    // ══════════════════════════════════════════════
    // NEXT DAY
    // ══════════════════════════════════════════════
    document.getElementById("nextDayBtn").onclick = () => {
      if (!records.length) return alert("Table is empty.");
      if (!confirm("Next Day? OB = previous CB, CB unchanged.")) return;
      records = records.map(r => {
        const oldCB = Number(r[3]||0), price = Number(r[5]||0);
        return [r[0], r[1], oldCB, oldCB, 0, price, 0, price*oldCB];
      });
      saveData(); renderGroupedTables(); alert("Next day applied.");
    };

    // ══════════════════════════════════════════════
    // CLOUD STORE / LIST / LOAD
    // ══════════════════════════════════════════════
    async function storeToCloud() {
      if (!currentUser) return alert("Please login first.");
      if (!records.length) return alert("No data to store.");
      const listName = prompt("Report name:", new Date().toLocaleDateString());
      if (!listName) return;
      const data = records.map(r => ({brand:r[0],ml:r[1],ob:r[2],cb:r[3],sales:r[4],price:r[5],sv:r[6],cbv:r[7]}));
      try {
        await db.collection("users").doc(currentUser.uid).collection("reports").add({
          name: listName, data, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Saved to cloud.");
      } catch (e) { console.error(e); alert("Error: " + e.message); }
    }
    document.getElementById("storeCloudBtn").onclick = storeToCloud;

    async function showCloudLists() {
      if (!currentUser) return alert("Please login first.");
      const modal = document.getElementById("listModal");
      const listDiv = document.getElementById("cloudDataList");
      modal.style.display = "flex";
      listDiv.textContent = "Loading...";
      try {
        const snap = await db.collection("users").doc(currentUser.uid).collection("reports").orderBy("timestamp","desc").get();
        listDiv.innerHTML = "";
        if (snap.empty) { listDiv.textContent = "No cloud reports found."; return; }
        snap.forEach(docSnap => {
          const d = docSnap.data();
          const div = document.createElement("div");
          div.className = "flex items-center justify-between glass-chip rounded-xl px-3 py-2";
          div.innerHTML = `
            <div>
              <span class="font-semibold text-slate-100">${d.name || "(no name)"}</span>
              <span class="text-slate-500 text-xs ml-2">${(d.data||[]).length} rows</span>
            </div>
            <button onclick="loadCloudReport('${docSnap.id}')" class="btn-neon btn-brand pill-button px-3 py-1.5 text-[11px] font-semibold">Load</button>
          `;
          listDiv.appendChild(div);
        });
      } catch (e) { console.error(e); listDiv.textContent = "Error: " + e.message; }
    }
    document.getElementById("listBtn").onclick = showCloudLists;

    window.loadCloudReport = async (id) => {
      if (!currentUser) return alert("Please login first.");
      if (!confirm("Overwrite current data?")) return;
      try {
        const docSnap = await db.collection("users").doc(currentUser.uid).collection("reports").doc(id).get();
        if (!docSnap.exists) { alert("Not found."); return; }
        const recs = docSnap.data().data || [];
        records = recs.map(o => [o.brand, o.ml, o.ob, o.cb, o.sales, o.price, o.sv, o.cbv]);
        saveData(); renderGroupedTables();
        document.getElementById("listModal").style.display = "none";
      } catch (e) { console.error(e); alert("Error: " + e.message); }
    };

    // ══════════════════════════════════════════════
    // THEME TOGGLE
    // ══════════════════════════════════════════════
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const rootHtml = document.documentElement;

    function setTheme(isDark) {
      if (isDark) {
        rootHtml.classList.add('dark');
        themeIcon.textContent = '🌙';
        if (themeLabel) themeLabel.textContent = 'Dark';
        try { localStorage.setItem('ui-theme', 'dark'); } catch {}
      } else {
        rootHtml.classList.remove('dark');
        themeIcon.textContent = '☀️';
        if (themeLabel) themeLabel.textContent = 'Light';
        try { localStorage.setItem('ui-theme', 'light'); } catch {}
      }
    }

    (function initTheme() {
      let stored = null;
      try { stored = localStorage.getItem('ui-theme'); } catch {}
      if (stored === 'dark') setTheme(true);
      else if (stored === 'light') setTheme(false);
      else setTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    })();

    themeToggle.addEventListener('click', () => setTheme(!rootHtml.classList.contains('dark')));

    // ══════════════════════════════════════════════
    // INIT
    // ══════════════════════════════════════════════
    loadData();
    renderBrandOptions("");
    renderGroupedTables();
  </script>
</body>
</html>
